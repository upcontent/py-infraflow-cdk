[tool.poetry]
name = "py-infraflow-runtime-aws"
version = "0.1.3"
description = "Build Event Based and Microservice infrastructure and connections using these reusable AWS+Boto3 patterns"
authors = ["Matthew Beatty <infraflow@upcontent.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "infraflow" }]

[tool.poetry.dependencies]
python = "^3.10"
redis = "^7.0.1"
boto3 = "^1.40.59"
pydantic = "^2.12.3"
#aws-wsgi = "^0.2.7"
structlog = "^25.5.0"
urllib3 = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-snapshot = "^0.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
